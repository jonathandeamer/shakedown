# src/literary.toml - hand-authored literary surface data
#
# Plan 1 ships home stable_utility for every character. Per-act variants for
# hybrid-voice cross-act characters are deferred to Slice 1 because act-site
# context dictates the exact phrase.

[play]
title = "Shakedown: A Most Excellent Tragicomedy of Glyph and Line."

[acts.act1]
title = "Wherein the witches sort raw matter into shelves and seals."

[acts.act2]
title = "Wherein the kingdom of blocks is shaped, and each form named."

[acts.act3]
title = "Wherein the lovers gild the line with light and rose."

[acts.act4]
title = "Wherein Prospero, his work done, inscribes and releases all."

[value_atoms.default]
v0 = "nothing"
v1 = "a cat"
v2 = "a black cat"
v4 = "a furry black cat"
v8 = "a little furry black cat"
v16 = "a normal little furry black cat"

[production_motifs]
juliet = ["night", "star", "stars", "starlit", "silver"]
prospero = ["revels", "inscribes", "releases", "seals"]
puck = ["messenger", "room", "colour", "flies"]
romeo = ["sun", "sunlit", "morning", "summer", "golden"]
rosalind = ["forest", "shelf", "references", "bargain"]

[iconic_moments.double_double]
surface = "scene_title"
scene = "HECATE_READ_INPUT"
phrase = "Double, double, toil and trouble"

[iconic_moments.out_damned_spot]
surface = "scene_title"
scene = "HECATE_LINE_RESTORE_BOUNDARY"
phrase = "Out, damned spot"

[iconic_moments.once_more_breach]
surface = "scene_title"
scene = "PASS_LISTS_BLOCK_START"
phrase = "Once more unto the breach"

[iconic_moments.rose_by_any_other_name]
surface = "scene_title"
scene = "LYRIC_TEST_AMPERSAND"
phrase = "A rose by any other name"

[iconic_moments.revels_ended]
surface = "scene_title"
scene = "ACT_IV_DONE"
phrase = "Our revels now are ended"

[dramatic_moments.hecate_final_exit]

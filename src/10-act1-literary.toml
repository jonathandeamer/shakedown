pattern = "bare_statement"

[scenes.HECATE_LINE_STRIP_SECOND_REFERENCE]
title = "The second shelf is read to its seal."
pattern = "bare_statement"

[scenes.HECATE_OPEN_COUNT_DECREMENT]

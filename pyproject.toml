[project]
name = "shakedown"
version = "0.0.1"
description = "A port of John Gruber's Markdown.pl to SPL"
requires-python = ">=3.12"
dependencies = [
    "shakespearelang>=0.6",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-xdist>=3.6",
    "pyright>=1.1",
    "ruff>=0.9",
]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-m 'not integration'"
markers = [
    "integration: invokes real subprocess backends; excluded from the default run",
]

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "standard"
venvPath = "."
venv = ".venv"
